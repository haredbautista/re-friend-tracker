spring:
  application:
    name: folienhaus-website
  thymeleaf:
    cache: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d
  # E-Mail-Versand des Kontaktformulars: erst aktiv, wenn ein SMTP-Host gesetzt ist, z. B.
  #   SPRING_MAIL_HOST=smtp.example.de SPRING_MAIL_PORT=587 SPRING_MAIL_USERNAME=... SPRING_MAIL_PASSWORD=...
  # mail:
  #   host: smtp.example.de
  #   port: 587
  #   username: ...
  #   password: ...
  #   properties:
  #     mail.smtp.auth: true
  #     mail.smtp.starttls.enable: true

server:
  port: 8080
  compression:
    enabled: true
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
